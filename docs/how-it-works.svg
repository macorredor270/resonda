<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 392" width="1200" height="392" role="img" aria-labelledby="t d">
<title id="t">Cómo funciona Resonda</title>
<desc id="d">Un enlace pasa por un extractor, se descarga por trozos, se convierte al formato elegido y se guarda con sus etiquetas. Los enlaces de catálogos de música se buscan antes en YouTube.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15151b"/><stop offset="0.55" stop-color="#1b1622"/><stop offset="1" stop-color="#241a2f"/></linearGradient><linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5a4f"/><stop offset="0.5" stop-color="#ff4d9a"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffd9d5"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff5a4f" stop-opacity="0.22"/><stop offset="1" stop-color="#ff5a4f" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#ff4d9a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="392" rx="26" fill="url(#bg)"/>
<text x="29" y="44" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#ff4d9a">ENLACE DIRECTO</text>
<text x="29" y="232" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#ff4d9a">CATÁLOGO DE MÚSICA</text>
<rect x="25" y="74" width="190" height="106" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/><text x="120.0" y="110" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Enlace</text><text x="120.0" y="136" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#c9c3d9">YouTube, TikTok,</text><text x="120.0" y="156" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#c9c3d9">Twitch o Bandcamp</text>
<rect x="265" y="74" width="190" height="106" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/><text x="360.0" y="110" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Extractor</text><text x="360.0" y="136" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#c9c3d9">reconoce el servicio</text><text x="360.0" y="156" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#c9c3d9">y lista los formatos</text>
