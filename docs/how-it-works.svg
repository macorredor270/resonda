<rect x="505" y="74" width="190" height="106" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/><text x="600.0" y="110" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Descarga</text><text x="600.0" y="136" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#c9c3d9">por trozos, en paralelo,</text><text x="600.0" y="156" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#c9c3d9">con reintentos</text>
<path d="M461 127.0L499 127.0" stroke="#ff4d9a" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
