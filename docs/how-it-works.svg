<path d="M701 127.0L739 127.0" stroke="#ff4d9a" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="985" y="74" width="190" height="106" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="url(#wave)" stroke-opacity="1" stroke-width="2"/><text x="1080.0" y="110" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Archivo</text><text x="1080.0" y="136" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#c9c3d9">con título, artista</text><text x="1080.0" y="156" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#c9c3d9">y portada</text>
<path d="M941 127.0L979 127.0" stroke="#ff4d9a" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="25" y="262" width="190" height="106" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/><text x="120.0" y="298" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Enlace</text><text x="120.0" y="324" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#c9c3d9">Spotify, Deezer,</text><text x="120.0" y="344" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#c9c3d9">Apple Music o Tidal</text>
<rect x="265" y="262" width="190" height="106" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/><text x="360.0" y="298" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Metadatos</text><text x="360.0" y="324" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#c9c3d9">título, artista,</text><text x="360.0" y="344" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#c9c3d9">duración y portada</text>
<path d="M221 315.0L259 315.0" stroke="#ff4d9a" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="505" y="262" width="190" height="106" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/><text x="600.0" y="298" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Emparejado</text><text x="600.0" y="324" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#c9c3d9">busca en YouTube la</text><text x="600.0" y="344" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#c9c3d9">grabación que encaja</text>
<path d="M461 315.0L499 315.0" stroke="#ff4d9a" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M701 315.0H720V208H360.0V186" stroke="#ff4d9a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="734" y="307.0" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#9d97b3">se descarga el audio</text>
<text x="734" y="327.0" text-anchor="start" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#9d97b3">de YouTube</text>
